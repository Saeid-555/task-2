<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب</title>
</head>
<body>
    <h1>نظام إدارة وتحليل نتائج الطلاب</h1>
    <p>تم تشغيل كود JavaScript الخاص بالنظام في الخلفية. افتح وحدة تحكم المتصفح (Console) لرؤية النتائج.</p>
    <script>
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }
            calculateAverage() {
                const total = this.grades.reduce((sum, grade) => {
                    return sum + grade;
                }, 0);

                return total / this.grades.length;
            }
            getGrade(average) {
                if (average >= 90) {
                    return "A";
                } else if (average >= 80) {
                    return "B";
                } else if (average >= 70) {
                    return "C";
                } else if (average >= 60) {
                    return "D";
                } else if (average >= 50) {
                    return "E";
                } else {
                    return "F";
                }
            }
            getResult(average) {
                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }
        const student1 = new Student(1, "Saeid", [80, 90, 70], 90);
        const student2 = new Student(2, "Mohamed", [45, 40, 48], 80);
        const student3 = new Student(3, "Ahmed", [60, 65, 70], 85);
        const student4 = new Student(4, "Omar", [30, 35, 40], 70);
        const studentsList = [student1, student2, student3, student4];
        const strugglingStudents = studentsList.filter((student) => {
            const average = student.calculateAverage();
            return average >= 40 && average <= 49;
        });
        const studentsAfterBonus = strugglingStudents.map((student) => {
            const average = student.calculateAverage();

            return {
                id: student.id,
                name: student.name,
                average: average,
                newAverage: average + 5
            };
        });
        const totalNewAverage = studentsAfterBonus.reduce((sum, student) => {
            return sum + student.newAverage;
        }, 0);
        let bonusAverage = 0;

        if (studentsAfterBonus.length > 0) {
            bonusAverage = totalNewAverage / studentsAfterBonus.length;
        }
        console.log("===== تقرير نتائج الطلاب =====");

        studentsList.forEach((student) => {
            const average = student.calculateAverage();
            const grade = student.getGrade(average);
            const result = student.getResult(average);

            console.log("------------------------------");
            console.log("رقم الجلوس:", student.id);
            console.log("اسم الطالب:", student.name);
            console.log("المتوسط:", average.toFixed(2));
            console.log("التقدير:", grade);
            console.log("النتيجة النهائية:", result);
        });
        console.log("===== الطلاب الذين شملتهم لجنة الرأفة =====");
        console.log(studentsAfterBonus);
        console.log("متوسط الطلاب بعد الرأفة:", bonusAverage.toFixed(2));
    </script>
</body>
</html>
